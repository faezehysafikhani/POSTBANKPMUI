    <script>
      try {
        var s = localStorage.getItem('pm_settings');
        if (s && JSON.parse(s).theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

  <body class="font-['Shabnam','Noto_Sans_Arabic',sans-serif] antialiased bg-slate-50 text-slate-900 selection:bg-emerald-600 selection:text-white">
